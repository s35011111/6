services:
  # Database
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - mynet
  # Redis
  redis:
    image: redis:6-alpine
    restart: unless-stopped

    command: redis-server --appendonly yes
    networks:
      - mynet

  # Django Application
  web:
    image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}
    volumes:
      - static_volume:/myapp/static
      - media_volume:/myapp/media

    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: db
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      - db
      - redis
    env_file:
      - .env

  # Celery Worker
  celery_worker:
    image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - redis
      - web
    networks:
      - mynet


  celery_beat:
     image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}
     container_name: myapp_beat
     restart: unless-stopped
     command: celery -A config beat --loglevel=info
     environment:
        DATABASE_HOST: db
     env_file:
       - .env
     depends_on:
       - db
       - redis
     networks:
       - mynet
  nginx:
    image: nginx:alpine
    container_name: myapp_nginx
    restart: unless-stopped
    ports:
     - "80:80"
     - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/myapp/static
      - media_volume:/myapp/media
    depends_on:
      - web
    networks:
      - mynet
volumes:
  postgres_data:
  static_volume:
  media_volume:
networks:
  mynet:
    driver: brige
