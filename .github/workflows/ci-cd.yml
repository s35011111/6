name: django-cicd

on: [push]


jobs:
  tests:
    runs-on: ubuntu-latest
    services:
     redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: start celery worker
        run: |
          celery -A config worker --loglevel=info --detach
          sleep 5 

      - name: Run tests
        env:
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
        run: python manage.py test

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
            host: ${{ secrets.SERVER_IP }}
            username: ${{ secrets.SSH_USER }}

            script: |
              
              echo "${{secrets.DOCKER_HUB_ACCESS_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

              
              sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

              
              sudo docker stop myapp || true
              sudo docker rm myapp || true

              
              mkdir -p ~/myapp-env
              echo "${{ secrets.ENV_FILE }}" > ~/myapp-env/.env

              
              sudo docker run -d \
                  --name myapp \
                  --restart unless-stopped \
                  -p 80:8000 \
                  --env-file ~/myapp-env/.env \
                  ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

              
              sudo docker image prune -f