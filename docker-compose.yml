
services:
  db:
    image: postgres:13
    container_name: myapp_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynet


  redis:
    image: redis:alpine
    container_name: myapp_redis
    restart: unless-stopped
    networks:
      - mynet

  web:
    image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}    # use the image built in CI
    container_name: myapp_web
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 myproject.wsgi:application
    env_file:
      - .env
    volumes:
      - static_volume:/myapp/static
      - media_volume:/myapp/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mynet
    # No ports published – internal only
  # Celery Worker
  celery_worker:
    image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment:
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - redis
      - web
    networks:
      - mynet


  celery_beat:
     image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}
     container_name: myapp_beat
     restart: unless-stopped
     command: celery -A config beat --loglevel=info
     environment:
        DATABASE_HOST: db
     env_file:
       - .env
     depends_on:
       - db
       - redis
     networks:
       - mynet

  nginx:
    image: nginx:alpine
    container_name: myapp_nginx
    restart: unless-stopped
    ports:
      - "80:80"                     # public HTTP
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/myapp/static
      - media_volume:/myapp/media
    depends_on:
      - web
    networks:
      - mynet

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  mynet_prod:
    driver: bridge