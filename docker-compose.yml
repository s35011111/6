version: '3.8'

services:
  db:
    image: postgres:13
    container_name: myapp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # optional, if you need external access
    networks:
      - mynet

  redis:
    image: redis:7-alpine
    container_name: myapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"          # optional
    networks:
      - mynet

  web:
    image: ${DOCKER_HUB_USERNAME}/myapp:${TAG-latest}   # tag is the commit SHA
    container_name: myapp_web
    restart: unless-stopped
    ports:
      - "80:8000"                            # host:container
    env_file:
      - .env                                  # all environment variables
    depends_on:
      - db
      - redis
    networks:
      - mynet

  celery_worker:
    image: ${DOCKER_HUB_USERNAME}/myapp:${TAG:-latest}
    container_name: myapp_celery
    restart: unless-stopped
    command: celery -A myproject worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - mynet

  # optional celery beat
  celery_beat:
     image: ${DOCKER_HUB_USERNAME}/myapp:${TAG}
     container_name: myapp_beat
     restart: unless-stopped
     command: celery -A myproject beat --loglevel=info
     env_file:
       - .env
     depends_on:
       - db
       - redis
     networks:
       - mynet

volumes:
  postgres_data:

networks:
  mynet:
    driver: bridge