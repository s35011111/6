name: Deploy

on:
  push:
    branches: [ main ]   # adjust to your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----- BUILD AND PUSH DOCKER IMAGE -----
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

      # ----- PREPARE SERVER: CREATE DIRECTORY AND CLEAN UP -----
      - name: Prepare server directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/app
            rm -f /home/${{ secrets.SSH_USER }}/app/docker-compose.yml
            rm -f /home/${{ secrets.SSH_USER }}/app/.env

      # ----- COPY DOCKER-COMPOSE.YML TO SERVER -----
      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SSH_USER }}/app/"

      # ----- CREATE .ENV FILE ON SERVER FROM SECRET -----
      - name: Create .env file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > /home/${{ secrets.SSH_USER }}/app/.env

      # ----- DEPLOY WITH DOCKER COMPOSE -----
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.0
        envs: GITHUB_SHA,DOCKER_HUB_USERNAME,DOCKER_HUB_ACCESS_TOKEN
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/app

            # Export variables for docker-compose
            export TAG=$GITHUB_SHA
            export DOCKER_HUB_USERNAME=$DOCKER_HUB_USERNAME

            # Login to Docker Hub (if using private images)
            echo "$DOCKER_HUB_ACCESS_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

            # Pull the new image
            docker compose pull web celery_worker

            # Stop and remove old containers (but keep volumes)
            docker compose down || true

            # Start new containers
            docker compose up -d

            # Run migrations (optional, uncomment if needed)
            # docker compose exec -T web python manage.py migrate

            # Clean up old images (optional)
            docker image prune -f